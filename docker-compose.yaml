services:
  pocketbase:
    image: spectado/pocketbase:latest
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pocketbase"]
    command: ["serve", "--http=0.0.0.0:8090", "--dir=/pb/pb_data", "--migrationsDir=/pb/pb_migrations"]
    expose:
      - "8090"
    volumes:
      - ./pb_migrations:/pb/pb_migrations:ro
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.polyglot-singer-http.entrypoints=http
      - traefik.http.routers.polyglot-singer-http.rule=Host(`sing.spike.network`)
      - traefik.http.routers.polyglot-singer-http.priority=1000
      - traefik.http.routers.polyglot-singer-http.service=polyglot-singer
      - traefik.http.routers.polyglot-singer-https.entrypoints=https
      - traefik.http.routers.polyglot-singer-https.rule=Host(`sing.spike.network`)
      - traefik.http.routers.polyglot-singer-https.tls=true
      - traefik.http.routers.polyglot-singer-https.tls.certresolver=letsencrypt
      - traefik.http.routers.polyglot-singer-https.service=polyglot-singer
      - traefik.http.services.polyglot-singer.loadbalancer.server.port=3000
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_PROVIDER: pocketbase
      POCKETBASE_URL: http://pocketbase:8090
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pb_data:
